name: Go Tests

on:
  push:
    branches: [ "main", "dev", "release/*" ]
  pull_request:
    branches: [ "main", "dev", "release/*" ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: 
          - "1.21"
          - "1.23.x"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
      
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Install dependencies
      working-directory: ./teamserver
      run: go mod download

    - name: Run unit tests
      working-directory: ./teamserver
      run: go test $(go list ./... | grep -v '/tests') -v -race -coverprofile=coverage.out
      env:
        ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./teamserver/coverage.out
        flags: unittests

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    # - name: Create test environment file
    #   run: |
    #     cat > .env.test << EOF
    #     POSTGRES_DB=meduza_test
    #     POSTGRES_USER=postgres
    #     POSTGRES_PASSWORD=testpassword123
    #     POSTGRES_SCHEMA=public
    #     POSTGRES_PORT=5433
    #     DOCKER_BASECONF_PATH=/app/config
    #     DOCKER_AGENT_PROJECT_FILEPATH=/app/agent
        
    - name: Start test services
      run: |
        echo "Starting test environment..."
        docker compose -f docker-compose.test.yml --env-file .env.example up -d meduza_db
        
    - name: Wait for services to be ready
      run: |
        echo "Waiting for services to be healthy..."
        timeout 60s bash -c 'until docker compose -f docker-compose.test.yml --env-file .env.example ps | grep -q "healthy"; do sleep 2; done'
        
    - name: Run e2e tests
      run: |
        echo "Running e2e tests..."
        docker compose -f docker-compose.test.yml --env-file .env.example run --rm test_runner
        
    - name: Collect test logs
      if: always()
      run: |
        echo "Collecting container logs..."
        docker compose -f docker-compose.test.yml --env-file .env.example logs meduza_db > db-logs.txt
        
    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-test-logs
        path: |
          db-logs.txt
        retention-days: 5
        
    - name: Tear down test environment
      if: always()
      run: |
        echo "Cleaning up test environment..."
        docker compose -f docker-compose.test.yml --env-file .env.example down --volumes --remove-orphans

  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: "1.23.x"
        
    - name: Build application
      working-directory: ./teamserver
      run: go build -v ./...
      
    # - name: Build Docker image
    #   run: |
    #     docker build -t meduza-teamserver:${{ github.sha }} -f teamserver/docker/Dockerfile teamserver/
        
    # - name: Save Docker image
    #   if: github.ref == 'refs/heads/dev'
    #   run: |
    #     docker save meduza-teamserver:${{ github.sha }} | gzip > meduza-teamserver.tar.gz
        
    # - name: Upload Docker image artifact
    #   if: github.ref == 'refs/heads/dev'
    #   uses: actions/upload-artifact@v3
    #   with:
    #     name: docker-image
    #     path: meduza-teamserver.tar.gz
    #     retention-days: 1