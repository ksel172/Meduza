root = "."
testdata_dir = "testdata"
tmp_dir = "build"

[build]
  args_bin = []
  cmd = "go build -o ./build/server ./cmd/main"
  bin = "build/server"
  delay = 1000
  exclude_dir = ["build", "tmp", "deployment", "docker"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go"]
  include_file = []
  kill_delay = "2s"
  log = "build/build.log"
  poll = true
  poll_interval = 500
  post_cmd = []
  pre_cmd = []
  rerun = true
  rerun_delay = 1000
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
